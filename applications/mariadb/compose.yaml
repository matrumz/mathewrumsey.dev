# Getting started: https://hub.docker.com/_/mariadb

x-ref:
  host:
    tz: &host_tz ${MATHEWRUMSEY_DEV_HOST__TZ:-America/New_York}

  mariadb:
    services:
      common: &mariadb_services_common
        environment: &mariadb_services_common_environment
          MARIADB_AUTO_UPGRADE: "1"
          MARIADB_ROOT_PASSWORD_FILE: &mariadb_services_common_environment_MARIADB_ROOT_PASSWORD_FILE /run/secrets/mariadb_root_password
          TZ: *host_tz
        healthcheck:
          # https://mariadb.com/kb/en/using-healthcheck-sh/
          interval: 10s
          retries: 3
          start_period: 10s
          test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
          timeout: 5s
        labels: &mariadb_services_common_labels
          # Grafana
          dev.mathewrumsey.grafana.instance: default
          # Unraid
          net.unraid.docker.icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mariadb-logo.png
          net.unraid.docker.shell: bash
        pull_policy: missing
        restart: unless-stopped
        secrets:
          - source: mariadb.root_password
            target: *mariadb_services_common_environment_MARIADB_ROOT_PASSWORD_FILE

secrets:
  mariadb.root_password:
    name: mariadb.root_password
    ###
    file: secrets/root_password.txt

services:

  mariadb-v10:
    <<: *mariadb_services_common
    container_name: mariadb-v10
    image: mariadb:10
    ###
    networks: {}
    volumes:
      # Main data volume
      - bind:
          create_host_path: true
        source: .container-data/mariadb-v10/data
        target: /var/lib/mysql
        type: bind
